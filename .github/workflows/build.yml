name: Build YP79 Terpadu

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      ANDROID_NDK_VERSION: '28.2.13676358'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze (non-blocking, laporan saja)
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit & widget test
        continue-on-error: true
        run: flutter test --reporter expanded

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 tidak di-set. Build tanpa tanda tangan (debug key)."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > yp79-release.keystore
            echo "keystore decoded"
          fi

      - name: Build APK (release if keystore, else debug)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/yp79-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEYPASSWORD: ${{ secrets.KEYSTORE_KEYPASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          DEFINES=""
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            DEFINES="--dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "Backend dikonfigurasi lewat --dart-define."
          else
            echo "::warning::SUPABASE_URL/SUPABASE_ANON_KEY belum di-set sebagai repo secret. APK akan ter-build tetapi login/DB nonaktif (layar 'backend belum dikonfigurasi'). Tambahkan kedua secret tersebut untuk APK yang benar-benar terhubung ke database."
          fi
          # Web client ID OAuth Google (client_type 3 di google-services.json).
          # Bukan rahasia: nilainya memang ikut ter-commit di file itu. Dipakai
          # sebagai serverClientId Google Sign-In supaya ID token yang diterbitkan
          # ber-aud Web client, sesuai konfigurasi provider Google di Supabase.
          if [ -n "$GOOGLE_WEB_CLIENT_ID" ]; then
            DEFINES="$DEFINES --dart-define=GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"
            echo "Google Sign-In dikonfigurasi."
          else
            echo "::warning::GOOGLE_WEB_CLIENT_ID kosong. Tombol 'Masuk dengan Google' tampil nonaktif (bukan gagal diam)."
          fi
          # android-x86_64 (emulator) 19 MB dan tidak pernah dipakai HP asli.
          # Sisakan arm64-v8a (HP modern) + armeabi-v7a (HP 32-bit lawas) supaya
          # satu APK tetap bisa dipasang di semua HP: 52 MB -> ~34 MB.
          # Kalau butuh jalan di emulator, tambahkan android-x86_64 ke daftar.
          ABI="--target-platform=android-arm64,android-arm"
          if [ -n "$KEYSTORE_PASSWORD" ] && [ -f "$KEYSTORE_PATH" ]; then
            flutter build apk --release --obfuscate --split-debug-info=debug $ABI $DEFINES
            echo "Built release APK with signature"
          else
            flutter build apk --debug $ABI $DEFINES
            cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/app-release.apk
            echo "Built debug APK (no keystore secrets set)"
          fi

      - name: Upload APK artifact
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: yp79-terpadu-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 5

      - name: Upload simbol Dart (buat baca stack trace crash)
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: yp79-simbol-debug
          # --obfuscate + --split-debug-info bikin stack trace Crashlytics tidak
          # kebaca tanpa file ini. Cara pakai:
          #   flutter symbolize -i trace.txt -d app.android-arm64.symbols
          path: debug/
          if-no-files-found: warn
          retention-days: 30

      - name: Release APK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: YP79 Terpadu ${{ github.run_number }}
          tag_name: v${{ github.run_number }}
          generate_release_notes: true

# ============================================================
# Secrets yang dibutuhkan di repo ini (GitHub → Settings → Secrets):
#   KEYSTORE_BASE64      - base64(yp79-release.keystore)
#   KEYSTORE_PASSWORD    - store password
#   KEYSTORE_KEYPASSWORD - key password
#   KEYSTORE_ALIAS       - alias (mis. yp79-release)
# Jika kosong, CI tetap build APK debug agar tidak gagal total.
# ============================================================
