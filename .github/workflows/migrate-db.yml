name: Migrasi Database Supabase

# Push seluruh migrasi SQL ke project Supabase.
# Jalankan manual dari tab Actions (atau via `gh workflow run migrate-db.yml`).
#
# Kenapa lewat CI: DDL (create table / policy / function) TIDAK BISA dijalankan
# dengan publishable/anon key. Hanya bisa lewat koneksi Postgres langsung atau
# Supabase Management API (token sbp_). Supaya token TIDAK pernah muncul di chat
# ataupun di repo, token disimpan sebagai GitHub Secret.
#
# Secret yang dibutuhkan (pilih salah satu mode):
#   Mode management-api : SUPABASE_ACCESS_TOKEN  (sbp_... dari
#                        https://supabase.com/dashboard/account/tokens)
#   Mode psql           : SUPABASE_DB_URL        (postgresql://postgres:<password>@db.<ref>.supabase.co:5432/postgres)

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: 'Project ref Supabase (bagian depan URL: https://<ref>.supabase.co)'
        required: true
      mode:
        description: 'Cara push'
        required: true
        default: 'management-api'
        type: choice
        options:
          - management-api
          - psql

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validasi input
        env:
          PROJECT_REF: ${{ inputs.project_ref }}
        run: |
          if ! echo "$PROJECT_REF" | grep -Eq '^[a-z0-9]{20}$'; then
            echo "::error::project_ref tidak valid (harus 20 karakter huruf kecil/angka). Diterima: '$PROJECT_REF'"
            exit 1
          fi
          echo "Target project: $PROJECT_REF"
          ls -1 supabase/migrations/*.sql

      - name: Push migrasi via Management API
        if: ${{ inputs.mode == 'management-api' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ inputs.project_ref }}
        run: |
          set -e
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN belum di-set di repo ini."
            exit 1
          fi
          for f in $(ls -1 supabase/migrations/000*.sql | sort); do
            echo "=================== $f ==================="
            python3 -c "import json,sys; print(json.dumps({'query': open(sys.argv[1], encoding='utf-8').read()}))" "$f" > /tmp/payload.json
            code=$(curl -s -o /tmp/out.txt -w '%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              --max-time 120 \
              --data-binary @/tmp/payload.json)
            echo "HTTP $code"
            head -c 4000 /tmp/out.txt
            echo
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::Migrasi GAGAL pada $f (HTTP $code). Berhenti di sini agar tidak setengah jalan."
              exit 1
            fi
          done
          echo "Semua migrasi selesai."

      - name: Push migrasi via psql
        if: ${{ inputs.mode == 'psql' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -e
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Secret SUPABASE_DB_URL belum di-set di repo ini."
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          for f in $(ls -1 supabase/migrations/000*.sql | sort); do
            echo "=================== $f ==================="
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
          echo "Semua migrasi selesai."

      - name: Ringkasan
        if: ${{ success() }}
        run: |
          echo "### Migrasi Supabase selesai" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Project ref: \`${{ inputs.project_ref }}\`  ·  mode: \`${{ inputs.mode }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Langkah berikutnya: uji dengan publishable key ke endpoint" >> $GITHUB_STEP_SUMMARY
          echo "\`/rest/v1/profiles?select=id&limit=1\` — harus balas \`[]\`, bukan PGRST205." >> $GITHUB_STEP_SUMMARY
